name: CI Pipeline (5 Quality Gates)

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ==========================================
  # Gate 1: Lint & Format Check
  # ==========================================
  gate-1-lint-format:
    name: "Gate 1: Lint & Format"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install Python Linters
        run: |
          pip install ruff

      - name: Lint & Format Backend
        run: |
          cd backend
          ruff check app/ tests/
          ruff format app/ tests/ --check

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: frontend/package.json

      - name: Install Frontend Dependencies
        run: |
          cd frontend
          npm install

      - name: Lint Frontend
        run: |
          cd frontend
          npm run lint

  # ==========================================
  # Gate 2: Type Checking
  # ==========================================
  gate-2-typecheck:
    name: "Gate 2: Type Checking"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install Backend Dependencies
        run: |
          cd backend
          pip install -r requirements.txt

      - name: Mypy Type Check Backend
        run: |
          cd backend
          mypy app/

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: frontend/package.json

      - name: Install Frontend Dependencies
        run: |
          cd frontend
          npm install

      - name: TypeScript Type Check Frontend
        run: |
          cd frontend
          npm run type-check

  # ==========================================
  # Gate 3: Security & Secrets
  # ==========================================
  gate-3-security:
    name: "Gate 3: Security & Secrets"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ==========================================
  # Gate 4: Unit Testing & Coverage
  # ==========================================
  gate-4-tests:
    name: "Gate 4: Unit Tests & Coverage"
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: secure_db_pass_2026
          POSTGRES_DB: adaptive_sql_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install Backend Dependencies
        run: |
          cd backend
          pip install -r requirements.txt
          pip install httpx

      - name: Run Pytest with Coverage
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:secure_db_pass_2026@localhost:5432/adaptive_sql_test
        run: |
          cd backend
          pytest tests/ -v

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: frontend/package.json

      - name: Install Frontend Dependencies
        run: |
          cd frontend
          npm install

      - name: Run Frontend Tests (Vitest)
        run: |
          cd frontend
          npx vitest run

  # ==========================================
  # Gate 5: Build Check (Docker Compose)
  # ==========================================
  gate-5-build:
    name: "Gate 5: Docker Build Check"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate Docker Compose Configuration
        run: |
          docker compose config

      - name: Build Docker Images
        run: |
          docker compose build --parallel
