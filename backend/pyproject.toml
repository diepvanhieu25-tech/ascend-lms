[tool.poetry]
name = "lms-backend"
version = "0.1.0"
description = "Adaptive Learning SQL Backend"
authors = ["Admin"]

[tool.ruff]
line-length = 100
target-version = "py310"
exclude = [".git", ".venv", "migrations", "__pycache__"]
force-exclude = true
src = ["backend", "backend/app", "app"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-ra -q --cov=app --cov-report=term-missing"
testpaths = [
    "tests",
]
asyncio_mode = "auto"

[tool.mypy]
strict = true
exclude = ["migrations"]

[[tool.mypy.overrides]]
module = [
    "onnxruntime",
    "onnxruntime.*",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = [
    "numpy",
    "numpy.*",
]
follow_imports = "silent"
ignore_missing_imports = true
